name: Tests

# Draait de geautomatiseerde regressietests (Playwright + pytest) bij elke push.

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch: {}

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - name: Dependencies
        run: pip install -r requirements-test.txt
      - name: Chromium installeren
        run: python -m playwright install --with-deps chromium
      - name: Tests
        run: pytest -q
