name: Deploy to Test

on:
  push:
    branches: [development]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: test
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production (main)
        uses: actions/checkout@v4
        with:
          ref: main
          path: main

      - name: Checkout test (development)
        uses: actions/checkout@v4
        with:
          ref: development
          path: development

      - name: Assemble site (production at root, test build under /test)
        run: |
          mkdir -p dist/test
          cp main/index.html dist/index.html
          cp development/index.html dist/test/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
