<!doctype html>
<html lang="nl">
<meta charset="utf-8">
<title>VSA-nabootsing — contracttest</title>
<!--
  Nabootsing van de Ventus Slimme Assistent voor de inbouwstand van de module.
  Implementeert de portaalkant van het contract (zie docs/vsa-inbouwcontract-v1-reactie.md)
  zodat de koppeling getest kan worden zonder het echte portaal.

  De testen sturen dit aan via window.__vsa; zie tests/test_inbouw.py.
-->
<style>
  html,body { margin:0; height:100%; font:14px system-ui, sans-serif; background:#eceef1 }
  #kader { width:100%; height:100%; border:0; display:block }
</style>
<iframe id="kader" title="Kilometerdeclaratie"></iframe>
<script>
(function () {
  var kader = document.getElementById('kader');

  var V = window.__vsa = {
    log: [],              // elk ontvangen bericht, op volgorde
    doc: null,            // het document zoals het portaal het bewaart
    versie: 7,            // huidige serverversie
    locatie: false,       // mag de module "Huidige locatie" tonen?
    autoLaden: true,      // automatisch antwoorden op gereed/herladen
    ladenVertraging: 0,   // ms vertraging op dat antwoord
    antwoord: 'normaal',  // normaal | fout | te-groot | stil
    bewaarTeller: 0
  };

  V.start = function (zoek) {
    kader.src = '/index.html?inbouw=vsa' + (zoek || '');
  };
  V.stuur = function (b) {
    b.km = 1;
    kader.contentWindow.postMessage(b, location.origin);
  };
  V.laatste = function (type) {
    for (var i = V.log.length - 1; i >= 0; i--) if (V.log[i].type === type) return V.log[i];
    return null;
  };
  V.aantal = function (type) {
    return V.log.filter(function (b) { return b.type === type; }).length;
  };
  /* Een ander apparaat heeft opgeslagen: de serverversie loopt vooruit op wat de module kent. */
  V.elders = function () { V.versie += 1; };

  window.addEventListener('message', function (e) {
    if (e.source !== kader.contentWindow || e.origin !== location.origin) return;
    var b = e.data;
    if (!b || b.km !== 1 || typeof b.type !== 'string') return;
    V.log.push(b);

    if (b.type === 'gereed' || b.type === 'herladen') {
      if (!V.autoLaden) return;
      setTimeout(function () {
        V.stuur({ type: 'laden', data: V.doc, versie: V.versie, locatie: V.locatie });
      }, V.ladenVertraging);
      return;
    }

    if (b.type === 'bewaren') {
      V.bewaarTeller++;
      if (V.antwoord === 'stil') return;
      if (V.antwoord === 'fout') {
        return V.stuur({ type: 'fout', melding: 'Opslaan is mislukt. Probeer het opnieuw.' });
      }
      if (V.antwoord === 'te-groot') {
        return V.stuur({ type: 'fout', reden: 'te-groot',
                         melding: 'Je administratie is groter dan de toegestane 2 MB.' });
      }
      /* Optimistische versiecontrole: alleen het nummer dat wij nu hebben mag schrijven.
         Een module die na een conflict precies ons nummer terugstuurt, overschrijft bewust. */
      if (b.versie !== V.versie) {
        return V.stuur({ type: 'conflict', versie: V.versie });
      }
      V.doc = b.data;
      V.versie = V.versie + 1;
      V.stuur({ type: 'bewaard', versie: V.versie });
    }
  });
})();
</script>
</html>
